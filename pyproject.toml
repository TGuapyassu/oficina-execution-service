[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oficina-execution-service"
version = "0.1.0"
description = "Microsserviço de execução e fila de produção"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pika>=1.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "oficina-contracts @ git+https://github.com/TGuapyassu/oficina-contracts.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-bdd>=7.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short --cov=app --cov-report=term-missing --cov-report=html:docs/evidencias/htmlcov --cov-fail-under=80"

[tool.coverage.run]
omit = [
  "app/**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
