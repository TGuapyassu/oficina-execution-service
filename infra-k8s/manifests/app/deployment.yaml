apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution-service
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-execution-service
  template:
    metadata:
      labels:
        app: oficina-execution-service
    spec:
      containers:
        - name: api
          image: oficina-execution-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: oficina-execution-config
            - secretRef:
                name: oficina-execution-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
